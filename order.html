<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bestellen – Just A Buck</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-hero{
      max-width:900px;
      margin:3rem auto;
      text-align:center;
      padding:2rem 1rem;
      background:linear-gradient(135deg,rgba(107,33,168,.12),rgba(168,85,247,.12));
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.1);
    }
    .order-options{
      display:flex;
      flex-direction:column;
      gap:1rem;
      margin-top:2rem;
    }
    .order-options a{
      font-size:1.1rem;
      text-align:center;
    }
    .order-logo{
      display:flex;
      justify-content:center;
      margin-bottom:1rem;
    }
    .order-logo img{
      height:90px;
      width:auto;
    }
  </style>
</head>
<body class="menu-page">
  <main class="menu-content">
    <div class="order-hero">
      <div class="order-logo">
        <img src="img/logo.png" alt="Just A Buck Logo">
      </div>
      <p class="eyebrow">Ready to eat?</p>
      <h1>Bestellen bei Just A Buck</h1>
      <p>Wähle, ob wir zu dir liefern sollen oder du dein Essen vor Ort abholen möchtest.</p>
      <div class="order-options">
        <a class="btn-primary" href="https://www.lieferando.de" target="_blank" rel="noopener">Lieferservice (Lieferando)</a>
        <a class="btn-ghost" href="https://wa.me/4917612345678" target="_blank" rel="noopener">Vor Ort abholen (WhatsApp)</a>
        <a class="btn-ghost" href="/">Zurück zur Startseite</a>
      </div>
    </div>
  </main>
</body>
</html>
